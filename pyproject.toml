[project]
name = "cscoach-backend"
version = "0.1.0"
description = "Counter-Strike coaching and analytics backend"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy"
]

[build-system]
requires = [
    "setuptools>=68"
]
build-backends = [
    "setuptools.build_meta"
]

[tool.setuptools.packages.find]
include = ["app*"]